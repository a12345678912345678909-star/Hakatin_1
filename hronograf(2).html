*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Nunito","Trebuchet MS","Comic Sans MS","Segoe UI",system-ui,sans-serif;font-weight:700;color:#294333;background:linear-gradient(#e7efd9,#f6f0d9 55%,#fff9e9);background-attachment:fixed;overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 40px}
h1{margin:0;text-align:center;font-size:2.2rem;color:#fff;text-shadow:0 4px 0 #9a7835,0 7px 0 rgba(0,0,0,.15);letter-spacing:1px}
.sub{text-align:center;margin:8px 0 16px;color:#617a59}

.mascot{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.owl{font-size:3.2rem;animation:wob 3s ease-in-out infinite}
.bubble{background:#f8f0d8;border:3px solid #d5b96a;border-radius:18px;padding:8px 14px;flex:1;position:relative}
.bubble:before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:12px solid #ffd23f;border-left:0}
.label{font-size:1.05rem;color:#9a7835;margin-bottom:8px}
.modes{display:grid;gap:12px}
.mode{all:unset;cursor:pointer;display:block;padding:14px 16px;border-radius:20px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .1s}
.mode:hover{transform:translateY(-2px)}.mode:focus-visible,.chip:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid #d5b96a;outline-offset:3px}.mode:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.mode:nth-child(1){background:#356b45}.mode:nth-child(2){background:#648b50}.mode:nth-child(3){background:#b18b3d}
.mode b{display:block;font-size:1.25rem}.mode span{font-size:.95rem;opacity:.95}.mode small{float:right;background:rgba(255,255,255,.28);border-radius:12px;padding:2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.inventory{margin-top:12px;padding:10px 12px;background:#f5f2e5;border:1px solid #dfd2a8;border-radius:14px;color:#617a59;font-size:.9rem;line-height:1.45}
.inventory p{margin:3px 0}
.filter-title{font-size:.95rem;color:#617a59;margin:14px 0 7px}
.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip.small{font-size:.86rem;padding:7px 11px}
.filter-note{font-size:.82rem;color:#71836b;margin:7px 0 0;line-height:1.4}
.chip{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;background:#f4f1e4;border:3px solid #d8c991;font-size:.95rem}
.chip.on{background:#4f8052;border-color:#315b39;color:#fff}
.chip:focus-visible{outline:3px solid #d5b96a;outline-offset:3px}
.quiz-toolbar{display:flex;justify-content:flex-end;margin-bottom:10px}.exit-btn{all:unset;cursor:pointer;padding:7px 12px;border:2px solid #d8c991;border-radius:12px;color:#6b6248;background:#f8f4e7;font-size:.9rem}.exit-btn:hover{background:#efe6c8}.exit-confirm{display:none;margin:0 0 14px;padding:12px;background:#f8f0d8;border:2px solid #d5b96a;border-radius:16px;text-align:center}.exit-confirm p{margin:0 0 10px}.exit-confirm .row{margin-top:8px}.top{display:flex;justify-content:space-between;font-size:1rem;margin-bottom:6px}
.bar{height:16px;background:#edf0df;border-radius:10px;overflow:hidden;margin-bottom:14px;border:2px solid #c9d2ac}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8eaa68,#d5b96a,#4f8052);transition:width .4s;border-radius:10px}
.emo{font-size:4.2rem;text-align:center;animation:bounce 1.6s ease-in-out infinite}
.era{text-align:center;font-size:.85rem;color:#9b6dff}
.q{font-size:1.4rem;text-align:center;margin:6px 0 16px;line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opts.one{grid-template-columns:1fr}
.opt{all:unset;cursor:pointer;text-align:center;padding:16px 8px;border-radius:20px;color:#fff;font-size:1.3rem;box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .1s;line-height:1.25}
.opt:nth-child(1){background:#9b7650}.opt:nth-child(2){background:#4f8052}.opt:nth-child(3){background:#718b54}.opt:nth-child(4){background:#b18b3d}
.opt:hover:not([disabled]){transform:translateY(-2px)}.opt:active:not([disabled]){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.opt[disabled]{cursor:default;opacity:.45}
.opt.ok{background:#37b24d!important;opacity:1;animation:bounce .6s}
.opt.bad{background:#868e96!important;opacity:1;animation:shake .4s}
.opts.one .opt{font-size:1.1rem;padding:14px}
.ans{display:flex;gap:10px}
.ans input{flex:1;min-width:0;font:inherit;font-size:1.6rem;text-align:center;padding:12px;border:4px solid #c9d2ac;border-radius:18px;color:#3b2f63}
.ans input:focus{outline:none;border-color:#b18b3d}
.btn{all:unset;cursor:pointer;background:#4f8052;color:#fff;padding:13px 22px;border-radius:18px;font-size:1.1rem;text-align:center;box-shadow:0 5px 0 #315b39}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2f9e44}
.btn.alt{background:#b18b3d;box-shadow:0 5px 0 #87682e}
.fb{margin-top:16px;padding:12px 14px;border-radius:18px;text-align:center;font-size:1.05rem}
.fb.ok{background:#e4efdc;color:#315b39}.fb.bad{background:#f5e8d0;color:#84602c}
.fb .btn{margin-top:10px;display:inline-block}
.stars{font-size:3.2rem;text-align:center;letter-spacing:6px}
.stars span{display:inline-block;animation:bounce 1s ease-in-out infinite}
.big{text-align:center;font-size:2.4rem;color:#9a7835;margin:0}
.list{list-style:none;padding:0;margin:8px 0 0}
.list li{padding:8px 4px;border-bottom:2px dashed #d8c991}.list b{color:#9a7835}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.pc{position:fixed;top:55vh;font-size:1.8rem;pointer-events:none;animation:fly 1.4s ease-out forwards;z-index:9}
@keyframes bounce{50%{transform:translateY(-8px)}}
@keyframes wob{50%{transform:rotate(-8deg)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fly{to{transform:translate(var(--dx),-45vh) rotate(360deg);opacity:0}}
</style>

 ["ЮАР / Южная Африка",/(юар|южн(?:ая|ой) африк|бурск|апартеид|мандела)/i],
 ["Корея",/(коре[яй]|чосон|сеул)/i],
 ["Нидерланды",/(нидерланд|голланд|амстердам|оранск)/i],
 ["Швейцария",/(швейцар|женев|кальвин)/i],
 ["Чехия",/(чех|праж|богем)/i],
 ["Австрия",/(австри|габсбург|венск|вен[ае])/i],
 ["Украина",/(украин|запорож|гетман|киевск)/i],
 ["Сербия / Балканы",/(серби|балкан|югослав|белград)/i],
 ["Израиль / Палестина",/(израил|иерусалим|палестин|евре[йи])/i],
 ["Канада",/(канад|оттава)/i],
 ["Международные",/./]
];
const countryOf=e=>{const t=e[2];for(const [name,re] of COUNTRY_RULES){if(re.test(t))return name}return "Международные"};
const POLICY={internal:"Внутренняя политика",external:"Внешняя политика",other:"Другие события"};
const policyOf=e=>{const t=e[2].toLowerCase();
 const ext=/(войн|битв|сражен|поход|вторжен|завоев|нападен|захват|договор|союз|перемир|дипломат|мирн(?:ый|ого) договор|крестов|осад[аыу]|конфликт|кампан|высадк|экспедиц|независимост.*получ|присоединя|аннекс|раздел.*импери)/i.test(t);
 const intr=/(реформ|революц|восстан|переворот|конституц|парламент|коронован|становится .*император|становится .*корол|избран|отречен|отмен[ае]|создан.*республик|провозглашен.*республик|основан.*государств|правлени|закон|эдикт|государственн|внутренн|кризис.*импери)/i.test(t);
 if(ext)return "external";if(intr)return "internal";return "other";
};
const COUNTRIES=[...new Set(E.map(countryOf))].sort((a,b)=>a.localeCompare(b,"ru"));
const POLICY_KEYS=Object.keys(POLICY);
const fmt=y=>y+" год";
const yearDifference=(given,correct)=>Math.abs(given-correct);
const differenceText=(given,correct)=>`Твой ответ: <b>${fmt(given)}</b>. Правильный ответ: <b>${fmt(correct)}</b>. Разница — <b>${yearDifference(given,correct)} ${plural(yearDifference(given,correct),"год","года","лет")}</b>.`;
function plural(n,one,few,many){const x=n%100;if(x>=11&&x<=14)return many;switch(n%10){case 1:return one;case 2:case 3:case 4:return few;default:return many}}
const MODES={
 pick:{n:"Выбери год",d:"Событие и четыре варианта года"},
 order:{n:"Что раньше?",d:"Два события — какое случилось раньше?"},
 type:{n:"Впиши год",d:"Для настоящих профи: дата из головы"}
};
const GOOD=["Ура! Так держать!","Ты настоящий историк!","Блестяще!","Вот это память!","Верно! Я горжусь тобой!"];
const BAD=["Ничего, в следующий раз запомним!","Не беда! Смотри, как правильно.","Ошибки помогают учиться!","Почти получилось!"];
const ROUND=10;
const $=s=>document.querySelector(s);
const app=$("#app");
const pick=a=>a[Math.floor(Math.random()*a.length)];
let S={mode:"pick",eras:ERA_KEYS.slice(),countries:COUNTRIES.slice(),policies:POLICY_KEYS.slice(),qs:[],i:0,score:0,streak:0,wrong:[],exact:0,answered:false,msg:"Привет! Я сова Мудрик. Давай учить даты вместе! 🎓"};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getBest(m){try{return +localStorage.getItem("chrono-kids:"+m)||0}catch(e){return 0}}
function setBest(m,v){try{localStorage.setItem("chrono-kids:"+m,String(v))}catch(e){}}
function owl(){return `<div class="mascot"><div class="owl">🦉</div><div class="bubble" id="say">${S.msg}</div></div>`}
function say(t){S.msg=t;const b=$("#say");if(b)b.textContent=t}
function pop(){for(let i=0;i<16;i++){const s=document.createElement("span");s.className="pc";s.textContent=["⭐","🎉","✨","🎈"][i%4];s.style.left=(15+Math.random()*70)+"vw";s.style.setProperty("--dx",(Math.random()*160-80)+"px");s.style.animationDelay=Math.random()*.2+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),1700)}}

function options(y){
 const set=new Set([y]);const maxYear=Math.max(...E.map(e=>e[0]));const step=Math.max(2,Math.round((maxYear-y)/40));let g=0;
 while(set.size<4&&g++<300){
  const v=y+(1+Math.floor(Math.random()*4))*step*(Math.random()<.5?-1:1);
  if(v>=1&&v<=maxYear)set.add(v);
 }
 return shuffle([...set]);
}

function filteredEvents(){
 return E.filter(e=>S.eras.includes(eraOf(e[0]))&&S.countries.includes(countryOf(e))&&S.policies.includes(policyOf(e)));
}
function toggleFilter(list,key,allKeys){
 if(list.length===allKeys.length)return [key];
 if(list.includes(key))return list.length>1?list.filter(x=>x!==key):list;
 return [...list,key];
}
function start(){
 const pool=filteredEvents();
 if(!pool.length){alert("По выбранным фильтрам событий не найдено. Выберите другие эпохи, страны или виды политики.");return;}
 const n=Math.min(ROUND,S.mode==="order"?Math.floor(pool.length/2):pool.length);
 const sh=shuffle(pool);
 if(S.mode==="order"){
  S.qs=[];
  for(let k=0;k<n;k++){
   const a=sh[k*2];let b=sh[k*2+1];
   if(a[0]===b[0])b=pool.find(e=>e[0]!==a[0])||b;
   S.qs.push([a,b]);
  }
 }else S.qs=sh.slice(0,n).map(e=>({e,o:options(e[0])}));
 Object.assign(S,{i:0,score:0,streak:0,wrong:[],exact:0,answered:false,msg:"Поехали! Выбирай внимательно. 🚀"});
 renderQ();
}

function home(){
 S.msg="Привет! Я сова Мудрик. Давай учить даты вместе! 🎓";
 const count=filteredEvents().length;
 app.innerHTML=`<div class="card"><div class="label">Выбери игру</div><div class="modes">${
  Object.entries(MODES).map(([k,m])=>`<button class="mode" data-m="${k}"><small>🏆 ${getBest(k)}</small><b>${m.n}</b><span>${m.d}</span></button>`).join("")
 }</div></div>
 <div class="card"><div class="label">Какие эпохи включить?</div><div class="chips">${
  Object.entries(ERAS).map(([k,v])=>{const active=k==="all"?S.eras.length===ERA_KEYS.length:S.eras.includes(k);return `<button class="chip ${active?"on":""}" data-e="${k}" aria-pressed="${active}">${v}</button>`}).join("")
 }</div>
 <div class="filter-title">Какие страны включить?</div><div class="chip-group">${
  `<button class="chip small ${S.countries.length===COUNTRIES.length?"on":""}" data-country="all" aria-pressed="${S.countries.length===COUNTRIES.length}">Все страны</button>`+COUNTRIES.map(c=>`<button class="chip small ${S.countries.includes(c)?"on":""}" data-country="${c}" aria-pressed="${S.countries.includes(c)}">${c}</button>`).join("")
 }</div>
 <div class="filter-title">Какие события политики изучать?</div><div class="chip-group">${
  `<button class="chip small ${S.policies.length===POLICY_KEYS.length?"on":""}" data-policy="all" aria-pressed="${S.policies.length===POLICY_KEYS.length}">Все виды</button>`+Object.entries(POLICY).map(([k,v])=>`<button class="chip small ${S.policies.includes(k)?"on":""}" data-policy="${k}" aria-pressed="${S.policies.includes(k)}">${v}</button>`).join("")
 }</div>
 <p class="filter-note">При первом нажатии на отдельную эпоху или страну она становится единственным выбранным фильтром. Последующие нажатия добавляют или убирают пункты. Кнопки «Все эпохи», «Все страны» и «Все виды» возвращают полный выбор соответствующего фильтра.</p>
 <div class="inventory" aria-live="polite"><p>Выбрано эпох: <b>${S.eras.length} из ${ERA_KEYS.length}</b></p><p>Выбрано стран: <b>${S.countries.length} из ${COUNTRIES.length}</b></p><p>Виды политики: <b>${S.policies.map(k=>POLICY[k]).join(", ")||"не выбраны"}</b></p><p>Событий по фильтрам: <b>${count}</b></p><p>Всего в базе: <b>${E.length}</b> ${plural(E.length,"событие","события","событий")}</p><p>В раунде — до <b>${ROUND}</b> вопросов.</p></div></div>`;
 app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;start()});
 app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{const k=b.dataset.e;S.eras=k==="all"?ERA_KEYS.slice():toggleFilter(S.eras,k,ERA_KEYS);home()});
 app.querySelectorAll("[data-country]").forEach(b=>b.onclick=()=>{S.countries=b.dataset.country==="all"?COUNTRIES.slice():toggleFilter(S.countries,b.dataset.country,COUNTRIES);home()});
 app.querySelectorAll("[data-policy]").forEach(b=>b.onclick=()=>{S.policies=b.dataset.policy==="all"?POLICY_KEYS.slice():toggleFilter(S.policies,b.dataset.policy,POLICY_KEYS);home()});
}
function head(){
 return `<div class="top"><span>Вопрос ${S.i+1} из ${S.qs.length}</span><span>⭐ ${S.score} · 🔥 ${S.streak}</span></div><div class="bar"><i style="width:${Math.round(S.i/S.qs.length*100)}%"></i></div>`;
}

function renderQ(){
 S.answered=false;
 if(S.i>=S.qs.length)return end();
 const q=S.qs[S.i];let body="";
 if(S.mode==="pick"){
  body=`<div class="emo">${q.e[1]}</div><div class="era">${ERAS[eraOf(q.e[0])]}</div><div class="q">${q.e[2]}</div><div class="opts">${q.o.map(y=>`<button class="opt" data-y="${y}">${fmt(y)}</button>`).join("")}</div>`;
 }else if(S.mode==="order"){
  body=`<div class="q">Какое событие случилось раньше? 🤔</div><div class="opts one">${q.map((e,k)=>`<button class="opt" data-k="${k}">${e[1]} ${e[2]}</button>`).join("")}</div>`;
 }else{
  body=`<div class="emo">${q.e[1]}</div><div class="era">${ERAS[eraOf(q.e[0])]}</div><div class="q">${q.e[2]}</div><div class="ans"><input id="inp" type="text" inputmode="numeric" autocomplete="off" placeholder="Год?" aria-label="Год"><button class="btn" id="go">Готово!</button></div>`;
 }
 app.innerHTML=`<div class="card"><div class="quiz-toolbar"><button class="exit-btn" id="ask-exit" type="button">Выйти из задания</button></div><div class="exit-confirm" id="exit-confirm" role="group" aria-label="Подтверждение выхода"><p>Выйти из задания? Текущий прогресс раунда не сохранится.</p><div class="row"><button class="btn alt" id="stay" type="button">Продолжить</button><button class="btn" id="confirm-exit" type="button">Выйти</button></div></div>${owl()}${head()}${body}<div id="fb"></div></div>`;
 const exitPanel=$("#exit-confirm");
 $("#ask-exit").onclick=()=>{exitPanel.style.display="block";$("#stay").focus()};
 $("#stay").onclick=()=>{exitPanel.style.display="none";$("#ask-exit").focus()};
 $("#confirm-exit").onclick=()=>{S.qs=[];S.i=0;home()};
 if(S.mode==="pick")app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerPick(b));
 if(S.mode==="order")app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerOrder(b));
 if(S.mode==="type"){
  const inp=$("#inp");inp.focus();
  $("#go").onclick=answerType;
  inp.onkeydown=e=>{if(e.key==="Enter")answerType()};
 }
}

function reward(ok){
 if(ok){S.streak++;S.score+=10+Math.min(S.streak-1,5)*2;pop()}else S.streak=0;
}
function feedback(ok,html,partial){
 say(ok?pick(GOOD):partial?"Совсем близко! Молодец!":pick(BAD));
 $("#fb").innerHTML=`<div class="fb ${ok||partial?"ok":"bad"}">${html}<br><button class="btn" id="next">${S.i+1>=S.qs.length?"Результаты 🎁":"Дальше ➜"}</button></div>`;
 const nx=$("#next");nx.focus();nx.onclick=()=>{S.i++;renderQ()};
 S.answered=true;
}

function answerPick(btn){
 if(S.answered)return;
 const q=S.qs[S.i],y=q.e[0],ok=+btn.dataset.y===y;
 app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.y===y)b.classList.add("ok")});
 if(!ok){btn.classList.add("bad");S.wrong.push(q.e)}else S.exact++;
 reward(ok);
 feedback(ok,ok?"Правильно! 🎉":differenceText(+btn.dataset.y,y));
}
function answerOrder(btn){
 if(S.answered)return;
 const q=S.qs[S.i],k=+btn.dataset.k,early=q[0][0]<q[1][0]?0:1,ok=k===early;
 app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;b.innerHTML+=`<br><small>${fmt(q[+b.dataset.k][0])}</small>`;if(+b.dataset.k===early)b.classList.add("ok")});
 if(!ok){btn.classList.add("bad");S.wrong.push(q[0],q[1])}else S.exact++;
 reward(ok);
 feedback(ok,ok?"Правильно! 🎉":`Ты выбрал событие ${fmt(q[k][0])}. `+differenceText(q[k][0],q[early][0]));
}
function answerType(){
 if(S.answered)return;
 const raw=$("#inp").value.replace(/\D/g,"");
 if(!raw){$("#inp").focus();return}
 const v=+raw,q=S.qs[S.i],y=q.e[0],d=Math.abs(v-y);
 $("#inp").disabled=true;$("#go").style.display="none";
 if(d===0){S.exact++;reward(true);feedback(true,"Точно в цель! 🎯")}
 else if(d<=Math.max(5,Math.round((2026-y)/200))){S.streak=0;S.score+=5;feedback(false,`Почти! ${differenceText(v,y)} (+5 ⭐)`,true)}
 else{S.wrong.push(q.e);reward(false);feedback(false,differenceText(v,y))}
}

function end(){
 const prev=getBest(S.mode),rec=S.score>prev;if(rec)setBest(S.mode,S.score);
 const r=S.exact/S.qs.length,st=r>=.9?3:r>=.6?2:1;
 const title=st===3?"Великий историк!":st===2?"Юный историк!":"Путешественник во времени!";
 const seen=new Set(),w=[];S.wrong.forEach(e=>{if(!seen.has(e[2])){seen.add(e[2]);w.push(e)}});
 S.msg=st===3?"Невероятно! Ты знаешь историю лучше меня!":"Отличная игра! Давай повторим и станем ещё сильнее.";
 if(st>1)pop();
 app.innerHTML=`<div class="card">${owl()}<div class="stars">${[1,2,3].map(n=>`<span style="animation-delay:${n*.15}s">${n<=st?"⭐":"☆"}</span>`).join("")}</div>
 <p class="big">${title}</p>
 <p style="text-align:center;margin:8px 0 0">Очки: <b>${S.score}</b> · верно: ${S.exact} из ${S.qs.length}${rec?"<br>🏆 Новый рекорд!":"<br>Рекорд: "+prev}</p>
 ${w.length?`<div class="label" style="margin-top:16px">📚 Давай повторим:</div><ul class="list">${w.map(e=>`<li>${e[1]} <b>${fmt(e[0])}</b> — ${e[2]}</li>`).join("")}</ul>`:`<p style="text-align:center;color:#315b39">Ни одной ошибки! 🎉</p>`}
 <div class="row"><button class="btn" id="again">Ещё раз!</button><button class="btn alt" id="menu">В меню</button></div></div>`;
 $("#again").onclick=start;$("#menu").onclick=home;
}
home();
</script>
</body>
</html>
